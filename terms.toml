[[rule]]
pattern = 'D\\,\(v\^\+|D\\,v\^|\bA\\,v\^\+|\bA\\T\s*p_c|\bD \(v\+ - v-\)|\bA\^T p_c|\bA v\+ = 0|[+-]D v-|\bD_e\b(?!\\,\\omega)'
use = 'M_f for the mass matrix of the floating base and C_c for the contact constraint matrix: M_f (v+ - v-) = C_c^T p_c, C_c v+ = 0 (D is the weight of the attitude error function, A the matrix of a linearization)'
where = ['chapters', 'notebooks', 'skills', 'figures', 'case_studies']
code = true
allow = ['| $D_e$, $A$, $I_R$ |', 'has $-D_e', 'The thesis writes $D_e$ for it']

[[rule]]
pattern = 'm_\{?L\}?\^\{?0|\\hat\{?m\}?_L|m_\{L,\\text\{(model|believed|nom)'
use = 'm_{L,0} for the load mass a controller believes, like J_0'
math = true

[[rule]]
pattern = 'The theorems are about blocks|guarantees are block by block|(cone|tension|cone and tension) filter\b'
use = '"The guarantees are per block." for that limit of a case study; safety filter for the program that enforces a barrier condition'
where = ['chapters']
ignore_case = true
