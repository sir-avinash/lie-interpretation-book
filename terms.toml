# Machine-checkable vocabulary and notation rules for the whole book.
#
#     python tools/check_terms.py
#
# The source of truth for every rule is chapters/appA_notation.md. A symbol or
# a term is added there, and here, before it is used in a chapter.
# Chapters use the macros of book.toml (\T, \SO, \R, \tr, \dd, \ddt ...).
# Notebooks and skills are read outside the book, so they use plain LaTeX
# (^\top, \mathrm{SO}(3), \mathbb{R}, \operatorname{tr}).

# ---------------------------------------------------------------------------
# Running list of decisions for Chapters 10, 12, 14, 16 and the robot library.
# Each is stated in chapters/appA_notation.md and, where a pattern can catch
# its variants, enforced by a rule at the end of this file.
#
#  estimates     A hat marks an estimate on every letter: \hat R, \hat q,
#                \hat\omega, \hat X, \hat b_g. The hat map is always the
#                postfix x^\wedge. No \omega_{\hat q}.
#  errors        E_r = \hat X X^{-1} = exp(\chi_r^\wedge), E_\ell = X^{-1}\hat X
#                = exp(\chi^\wedge): the estimate takes the slot of the actual
#                configuration, the truth that of the desired one (def3-invariant-errors).
#                The velocity and position parts of E_r are written out
#                (\hat v - E_R v), not named \eta_v, \eta_x: \eta is the variation on SO(3).
#  projector     \Pi_C projects onto ker C (not E_C): \Pi is the letter for a projection.
#  filter        \Sigma covariance, \Sigma_n, \Sigma_g, \Sigma_a, \Sigma_y noise,
#                \tilde y innovation (predicted minus measured), \tilde K Kalman gain,
#                C_y measurement matrix, n_g, n_a, n_y noise, b_g, b_a biases,
#                a_s specific force, x_c contact position, x_m landmark position
#                (not p: p is the discrete momentum), d the known vector of a measurement.
#  discrete      L_h, S_h (subscript h: d means desired), p_k discrete momentum,
#                \bar p_k after the first half kick, \Upsilon_k = R_k^T R_{k+1} step
#                rotation (not F_k: F is a force), \Omega_k step velocity,
#                \bar J = tr(J) I / 2 - J, \theta_k step angle, \Lambda_n.
#                "knot" for a grid point of a transcription, never "node".
#  flatness      \varphi flat output, x^{(k)} k-th derivative, jerk, snap.
#                \psi is the heading of eq6-Rd; it equals the yaw of eq-zyx only
#                when the roll or the pitch is zero. F = f R e_3 thrust vector.
#                Chain: joint 0 at the quadrotor, link i from joint i-1 to joint i.
#                c_j polynomial coefficients (local letter).
#  code names    a mark over a letter is appended without underscore: Rhat, Xhat,
#                qhat, omegahat, ytilde, Ktilde, Jbar, pbar, Dhat (like Rd, qd).
#                A time derivative keeps the underscore: R_dot. Sigma, Sigma_y,
#                Sigma_n, Sigma_ytilde, Pi_C, Upsilon_k. Library names: table
#                "Names in the robot library" (tblA-code) in the appendix.
#  library       rollout(..., hold=False) evaluates a moving input at every stage
#                (step(..., t=t)); hold=True (default) holds it over the step.
#  citations     (Author et al., 2026) with a comma. Hairer-Lubich-Wanner cited by
#                chapter (ch. IX), not by theorem number. Kotaru and Sreenath's S^2
#                filter cited without a venue (ECC 2019 is not confirmed).
#  \ell          only as the subscript of E_\ell; no \Sigma_\ell (eq14-left-right says it in words).
#  payload       a rigid body carried by several quadrotors; a point mass is a
#                cable-suspended load.
#  figures       the TRUE quantity beside an estimate is drawn like a reference
#                beside a motion: thin dashed gray, hollow marker.
#  biped         configuration manifold of the Reaction Mass Biped has dimension 14;
#                its stance dynamics involve 13 (the swing-leg length drops out).
#  scope         check_terms also scans case_studies/**/*.py and case_studies/README.md.
#
# Decisions for the case studies, Chapters 17 to 20 (tblA-cases and the
# paragraph "Case studies" of the conventions in the appendix).
#
#  rho           \rho is the body-frame vector from a reference point of a body to its
#                center of mass (pivot in eq4-pendulum, thrust point in Chapter 17).
#                \rho_i is the attachment point of cable i in the payload frame
#                (library name r[i]); r with a subscript stays a radius (r_o, r_min).
#  override      \delta\tau = \tau - \tau_d (eq17-dtau) is the override of a safety filter
#                and of the limits: the deviation of tblA-mpc from the torque the tracker
#                proposes. "Tell the predictor" (add the override to the predictor's input)
#                and "inform the barrier" (add \Delta_f to the barrier's model) are kept
#                as the names of the two wires of sec17-safety.
#  believed      m_{L,0} like J_0. Scripts of Chapter 17: rho, r_add, m_add, F_e, tau_e (tblA-code).
#  Delta         generalized: one vector that enters where the input enters. A torque in
#                the body frame in eq8-lumped, a force in the world frame in eq18-lumped.
#                Its predictor: v_p, \omega_p, \tilde e_v, \tilde e_\omega, \tilde k_v, \tilde k_\omega.
#  forces        F_e external force on a quadrotor. F_d also the thrust vector a cascade asks
#                for, or that of a reference. F alone in Chapter 18 is the thrust vector only:
#                the force on the bob in eq18-pendulum is written out. c in eq18-linear is local.
#  limits        f_max, \tau_max, T_min: stated once per case study and flagged
#                "our assumption" (r_min is the value of sec8-quad). T_min has one definition (smallest tension a cable must keep).
#  team          index i for vehicle i and its cable; (F_L, \tau_L) the wrench, G_L the grasp
#                map (G alone is the input matrix), T_int the internal force per cable,
#                T_d the stack of tension vectors of the plan (not \bar T: a planned quantity
#                takes the subscript d), H_ij the pairwise barrier function.
#  biped         R_1, R_P, R_2 (P: torso and hip), r = (r_1, r_2, r_3) slide distances
#                (code slide; a local meaning of r), l_0 nominal leg length, x_P, v_P hip,
#                t_s, \theta_s step, f_s slide forces, k_l, k_{\dot l}, k_r, k_{\dot r}.
#  impact        M_f mass matrix of the floating base (not D: D is the weight of the attitude
#                error function, and Chapter 20 uses both) and C_c contact constraint matrix
#                (not A: A is the matrix of a linearization; A_c is taken by Chapter 13).
#                M_f (v+ - v-) = C_c^T p_c, C_c v+ = 0. p_c impulse; x_c is the foot in
#                contact, as in Chapter 14. Superscripts - and + : before and after an
#                instantaneous event. Code: M_f, C_c in biped_walking.impact_matrices.
#  words         mission; ablation table ("Everything on" first, "one block changed at a
#                time"); flat feedforward and closed-loop feedforward; safety filter for every
#                barrier program; "The guarantees are per block." as the heading of that limit
#                in all four; step duration (not step time: h is the time step);
#                wrench, grasp map, internal force, tension distribution, reaction masses,
#                motion primitive, touchdown, stance leg, swing leg, force ratio, impulse.
#  geomech S^2   linearize varies the coefficient E_\xi as printed, radial part included.
#                Compared with a linearization of the projected equation, its sphere rows
#                differ by -(\xi x q)(q . E_\xi), with E_\xi in the sign of eq5-standard.
#                geomech prints the linearized rows with the inertia positive (M_lin = -M of
#                eq5-standard), so M_lin s_dot - A_lin s - B_lin du = -\delta E_\xi.
#                Confirmed numerically for the load and for teams of 2, 3 and 4 (the coefficient
#                fitted in the first draft of Chapter 19 equals -q . E_\xi to 3e-9; q . E_\xi
#                is zero for the lone pendulum and at states at rest).
#                Stated in sec18-linear, used in sec19-lqr, noted in sec5 (after linearize).
#  runtimes      no chapter quotes a wall-clock time as a fact.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------- spelling
# American spelling everywhere, code identifiers and plot labels included.

[[rule]]
pattern = '\b(lineari|stabili|normali|discreti|summari|memori|prioriti|optimi|parametri|generali|minimi|maximi|initiali|organi|recogni|visuali|characteri|penali|symmetri|orthonormali|regulari|speciali|standardi|utili|locali|reali|emphasi|synchroni|factori|diagonali)s(e|es|ed|ing|ation|ations|er|ers)\b'
use = 'the -ize spelling (linearization, stabilize, normalize, discretize)'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\banalys(e|es|ed|ing)\b'
use = 'analyze'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\b(modell|travell|labell|levell|signall|cancell)(ed|ing|er|ers)\b'
use = 'a single l (modeling, traveled, labeled)'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\bcent(re|res|red|ring)\b'
use = 'center'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\b(behaviour|colour|favour|neighbour|honour|labour|flavour|vapour)'
use = 'the -or spelling (behavior, color, favorite, neighbor)'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\bmanoeuv'
use = 'maneuver'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\b(metre|metres|litre|litres|fibre|fibres)\b'
use = 'meter, liter, fiber'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

[[rule]]
pattern = '\b(aeroplane|sceptic\w*|mould\w*|grey|programme|catalogue\w*|analogue|artefact\w*|whilst|amongst|learnt|judgement|defence|licence|anticlockwise)\b'
use = 'American spelling (airplane, skeptic, mold, gray, catalog, counterclockwise)'
where = ['chapters', 'figures', 'notebooks', 'skills', 'verify', 'case_studies']
ignore_case = true

# ------------------------------------------------- notation in the chapters

[[rule]]
pattern = '\^\{?\\top\}?|\^T\b|\^\{T\}|\^\{\\mathsf\{T\}\}|\^\\intercal|\^\\prime\b'
use = '\T for the transpose, as in R\T'
where = ['chapters']
math = true

[[rule]]
pattern = '\\mathrm\{S[OE]\}|\\mathbb\{R\}|\\operatorname\{tr\}|\\mathrm\{d\}|\\mathfrak\{s[oe]\}|\\mathfrak\{q\}|\\operatorname\{A[Dd]\}|\\operatorname\{ad\}'
use = 'the shared macros \SO, \SE, \R, \tr, \dd, \so, \se, \quat, \Ad, \ad'
where = ['chapters']
math = true

[[rule]]
pattern = '\bS[OE]\([23]\)'
use = '$\SO(3)$, $\SE(3)$ in math'
where = ['chapters']
math = false
allow = ['quadrotor UAV on SE(3)', 'evolving on SO(3) and S²']

[[rule]]
pattern = '\\frac\{\\dd\}\{\\dd ?t\}|\\tfrac\{\\dd\}\{\\dd ?t\}|\\dfrac\{\\dd\}\{\\dd ?t\}|\\frac\{d\}\{dt\}'
use = '\ddt'
where = ['chapters']
math = true

[[rule]]
pattern = '(?<![A-Za-z\\{])dt\b'
use = '\dd t'
where = ['chapters']
math = true

[[rule]]
pattern = 'I_3\b|I_\{3\}|\\mathbb\{[I1]\}|\\mathbf\{I\}|I_\{3\\times ?3\}'
use = 'I for the identity (a subscript only when the size is not 3, as in I_2)'
where = ['chapters', 'skills', 'notebooks', 'case_studies']
math = true

[[rule]]
pattern = '°'
use = '^\circ inside math'
where = ['chapters', 'skills', 'notebooks', 'case_studies']
math = true

[[rule]]
pattern = '(?m)^#{2,4} [^\n{]*\$'
use = 'no math in section headings'
where = ['chapters']

[[rule]]
pattern = '\(\[\]\(#eq[^)]*\)\)'
use = 'an equation reference without extra parentheses: it already renders as (6.2)'
where = ['chapters']

[[rule]]
pattern = '(Chapter|Section|Figure|Table|Theorem|Definition|Proposition|Example|Exercise|Appendix) \[\]\(#'
use = 'the bare reference [](#label): it already carries its name'
where = ['chapters']

# ---------------------------------- notation in notebooks and skills (plain LaTeX)

[[rule]]
pattern = '\\(SO|SE|R|T|tr|quat|ddt|dd|so|se|Ad|ad)(?![A-Za-z])'
use = 'plain LaTeX outside the book: \mathrm{SO}(3), \mathbb{R}, ^\top, \operatorname{tr}'
where = ['notebooks', 'skills', 'case_studies']
math = true

[[rule]]
pattern = '\^T\b|\^\{T\}|\^\\intercal'
use = '^\top for the transpose'
where = ['notebooks', 'skills', 'figures', 'case_studies']
math = true

[[rule]]
pattern = '\$SO\(3\)|\$SE\(3\)| SO\(3\)\$'
use = '\mathrm{SO}(3) in math'
where = ['notebooks', 'skills', 'case_studies']

# ------------------------------------------------- notation, everywhere

[[rule]]
pattern = '\\mathbb\{S\}|\\mathcal\{S\}\^|\\mathsf\{S\}\^|\\mathbf\{S\}\^'
use = 'S^2, S^1, S^3 in plain italic'
math = true

[[rule]]
pattern = '\\hat\{?\\(eta|xi|zeta|chi)\b|\\hat\{?\\Omega\}?\^\\vee|R(_[dk])?(\\[,;])?\s*\\hat\{?\\(Omega|omega)\b|\\hat\{?\\(Omega|omega)\}?(\\[,;])?\s*(R|q)\b|\\hat\{?\\(Omega|omega)\}?\s*\\in|\\widehat|\]_\{?\\times|\^\{?\\times\}?|\\operatorname\{skew\}|\\mathrm\{skew\}|\^\{\\wedge\}\^|\\wedge\}'
use = 'the postfix hat map x^\wedge (and x^\vee for its inverse)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
math = true

[[rule]]
pattern = '\\varepsilon'
use = '\epsilon'

[[rule]]
pattern = '\\lVert|\\rVert|\\Vert|\\left\\\||\\lvert|\\rvert'
use = '\|x\| for a norm and |x| for an absolute value'
math = true
allow = ['\rVert$ |', '\rVert^2$ |']

[[rule]]
pattern = '\\langle|\\rangle|\\bullet'
use = 'a \cdot b for the dot product'
math = true

[[rule]]
pattern = '\\mathbf\{|\\boldsymbol|\\bm\{|\\vec\{|\\vec '
use = 'plain italic symbols: vectors and matrices are not bold'
math = true
allow = ['\mathbf{1}']

[[rule]]
pattern = '\\(operatorname|mathrm|text)\{(expm|Exp|Log|logm)\}'
use = '\exp and \log'
math = true

[[rule]]
pattern = '\\(operatorname|mathrm|text)\{(Tr|trace|Trace)\}|\\text\{tr\}|\\mathrm\{tr\}'
use = '\tr (chapters) or \operatorname{tr} (notebooks, skills)'
math = true

[[rule]]
pattern = '\\(mathrm|text)\{(sgn|sign|diag|rank)\}|\\operatorname\{sign\}'
use = '\operatorname{sgn}, \operatorname{diag}, \operatorname{rank}'
math = true

[[rule]]
pattern = '\\cdot ?10\^|\\cdot ?10\{'
use = '\times10^{n} for powers of ten'
math = true

# ------------------------------------------------- symbols and conventions

[[rule]]
pattern = '_\{?\\?(text|mathrm|rm)?\{?(ref|des|cmd|sp|goal)\b|\^\{?\*\}?|\^\{?\\star\}?|\\bar\{?[RqxΩ]|\\bar\{?\\(Omega|omega)'
use = 'the subscript d for desired quantities (R_d, q_d, \Omega_d)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
math = true

[[rule]]
pattern = '\\dot ?R\s*=\s*\\(Omega|omega)\^\\wedge\s*R\b(?!\\,\\Omega)'
use = '\dot R = R\,\Omega^\wedge with \Omega in the body frame'
math = true
allow = ['\dot R = R\,\Omega^\wedge = \omega^\wedge R', '\dot R = \omega^\wedge R$ and $\delta R = \sigma^\wedge R']

[[rule]]
pattern = '\\dot ?q(_d)?\s*=\s*q(_d)?\s*\\times|\\delta ?q\s*=\s*q(_d)?\s*\\times|e_q\s*=\s*q\s*\\times\s*q_d|\\delta ?R\s*=\s*\\eta\^\\wedge'
use = '\dot q = \omega \times q, \delta q = \xi \times q, e_q = q_d \times q, \delta R = R\,\eta^\wedge'
math = true

[[rule]]
pattern = '\\delta ?\\omega\s*=\s*\\dot ?\\xi\s*-\s*\\omega'
use = '\delta\omega = \dot\xi - 2\,\omega\times\xi, the full variation on the sphere'
math = true
allow = ['The trap is']

[[rule]]
pattern = '\\eta\s*=\s*\(\\psi|E\([^)$]*\)\\,\\dot ?\\eta|\\eta\s*-\s*\\eta_d|K_d ?\\dot ?\\eta'
use = '\Theta = (\psi, \theta, \phi) for the Euler angles; \eta is the variation on SO(3)'
math = true

[[rule]]
pattern = '(\\theta|\\pi)\s*(\\[,;]\s*)?u\b|\bu\^\\wedge|\\;\s*u\b|about (unit )?axis \$u\$|unit axis \$u\$'
use = 'a for the unit rotation axis (u is the input)'
where = ['chapters', 'figures', 'notebooks', 'skills', 'case_studies']

[[rule]]
pattern = '\\psi\s*=\s*\\log|\\ad_\{[^}]*\}\\?,?\s*\\psi|\\exp\(\\psi|\\psi\\T ?P'
use = '\chi for the logarithm of the left-invariant error (\psi is the yaw angle)'
math = true

[[rule]]
pattern = '\\xi\s*=\s*\(V|\\xi_d\b|\\ad_\{\\xi|\\dot ?g\b|\\Ad_\{?g\b|g\\,\\xi|X\\,\\xi\^\\wedge'
use = '\zeta = (V, \Omega) for a twist or body velocity on a group, X for the group element (\xi is the variation on S^2, g is gravity)'
math = true

[[rule]]
pattern = '\(\\Omega,\s*V\)|\(\\omega,\s*v\)\s*\\in\s*\\R\^6'
use = 'twists ordered (V, \Omega), linear part first'
math = true

[[rule]]
pattern = 'P_T\b|s\(T\)|P\(T\)|\\int_0\^T\b|\\int_0\^\{T\}|T\s*=\s*N ?h|x\(T\)|\[0,\s*T\]'
use = 't_f for the final time (T is the cable tension)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
math = true

[[rule]]
pattern = '\\tr\\?!?\\?(big|Big)?\(G\b|G\\?,?\s*R_d\\T|R_d\\?,?\s*G\b|\bg_[123]\b|\\operatorname\{diag\}\(g_|G = \\tfrac12'
use = 'D = diag(d_1, d_2, d_3) for the weight of the attitude error function (G is the input matrix, g is gravity)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
math = true

[[rule]]
pattern = 'T_xM\b|T_x ?M\b|\\in M\b|\bM\s*=\s*\\\{'
use = '\mathcal{M} for a generic manifold (M is the mass matrix)'
where = ['chapters']
math = true

[[rule]]
pattern = 'M_\{k ?\+ ?1\}|M_k\b|M_0\s*=\s*B|M_1\s*=|dM_k'
use = '\Gamma_k for the matrices of the controllability rank test (M is the mass matrix)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
code = true

[[rule]]
pattern = '\bN\\T|N\^\\top|\bN\^T\b|N = blkdiag'
use = 'Z for a basis of the constraint subspace (N counts time steps)'
where = ['chapters', 'notebooks', 'skills', 'case_studies']
code = true

[[rule]]
pattern = '\\omega\\?,?\s*J\s*q|\\exp\(\\theta\\?,?\s*J\)|\\omega ?J\\\}'
use = '\Lambda for the quarter turn of the plane (J is the inertia matrix)'
where = ['chapters', 'figures', 'notebooks', 'case_studies']

[[rule]]
pattern = '\\rho_[ry]\b|\\rho_\{(r|y|tilt|yaw)\}'
use = '\theta_{\text{tilt}}, \theta_{\text{yaw}} (\rho is the vector to the center of mass)'
math = true

[[rule]]
pattern = '(?<!E_)\\ell\b|\bL_c\b|\bl_c\b|L_\{?\\?(text|mathrm)?\{?(cable|rod)'
use = 'l for a length (L is the Lagrangian)'
math = true

[[rule]]
pattern = '\b[xm]_\{?\\?(text|mathrm)?\{?(load|quad|payload)\b|\b[xm]_[lqp]\b'
use = 'x_L, m_L for the load and x_Q, m_Q for the quadrotor'
math = true

[[rule]]
pattern = '\be_[yz]\b|e_\{[xyz]\}|\\hat\{?[xyz]\}?\b|R(_d)?(\\[,;])?\s*e_x\b|\be_x\s*\\times|\\times\s*e_x\b|\(e_x,\s*e_[y2]'
use = 'e_1, e_2, e_3 for the standard basis (e_x is the position error and e_v the velocity error)'
where = ['chapters', 'notebooks', 'skills', 'figures', 'case_studies']
math = true
allow = ['\hat R']

[[rule]]
pattern = '\\tilde\{?\\?(R|q|Omega|omega)\b|\bR_e\b|\\Omega_e\b|\bq_e\b|e_\{?\\dot\{?R|\be_w\b|e_\{\\Omega_d|e_\{\\text\{vel\}\}_'
use = 'the error names e_R, e_\Omega, e_q, e_\omega, e_{\dot q}'
math = true

[[rule]]
pattern = '\b(M_b|M_\{b\}|\\tau_b|u_\\tau|u_f|f_\{?(T|th|thrust)\}?)\b|\\tau_\{?\\?(text|mathrm)?\{?(body|ext)'
use = '\tau for the body torque, f for the thrust, u for a generic input'
math = true

[[rule]]
pattern = 'E\s*=\s*0\b|\\,E\s*=|\\cdot ?E\b|\\top\}\)?E\$|\\T\)\\?,?E\b'
use = 'E_\xi, E_\eta: a coefficient of a variation always carries its subscript (E alone is the Euler-angle Jacobian)'
where = ['chapters', 'figures', 'skills']
math = true

# ------------------------------------------------------------------ terms

[[rule]]
pattern = '\b(inertial|fixed|spatial|global|earth|lab|ground) frame|inertial velocity|inertial axes'
use = 'world frame'
ignore_case = true
math = false

[[rule]]
pattern = 'spatial (angular )?velocit'
use = 'world-frame angular velocity'
ignore_case = true
math = false
allow = ['robotics literature also calls']

[[rule]]
pattern = 'body[- ]fixed|local frame|vehicle frame|body-frame frame'
use = 'body frame'
ignore_case = true
math = false

[[rule]]
pattern = 'navigation function|configuration error|error potential|misfit function'
use = 'error function'
ignore_case = true
math = false

[[rule]]
pattern = 'transported (velocity |angular velocity )?error|transport operator|the transport \$'
use = 'velocity error; transport map'
ignore_case = true
where = ['chapters', 'notebooks', 'skills', 'figures', 'case_studies']

[[rule]]
pattern = 'infinitesimal variation|velocity deviation|perturbation vector|variation coordinates'
use = 'variation; linear state'
ignore_case = true
where = ['chapters', 'skills', 'figures']
math = false

[[rule]]
pattern = 'almost[ -]global(?!ly)\w*\s+(?!stab|asymp|exponential|attract|guarantee|claim|result|statement|theorem|propert|converg|tracking|regulat|behav|control|law\b|barrier|region|domain|basin)\w+|almost global\b|almost-globaly'
use = 'almost-global (hyphenated, as an adjective before stability, attractiveness, convergence, tracking, control, claim, guarantee, result)'
ignore_case = true
math = false

[[rule]]
pattern = '\b\d+[- ]degrees?\b(?! of freedom)|flip-over'
use = 'the ° sign: 90°, half a turn'
ignore_case = true
where = ['chapters', 'skills', 'figures']
math = false

[[rule]]
pattern = 'coordinate free\b|coordinate-independent|chart-free|co-ordinate'
use = 'coordinate-free'
ignore_case = true
math = false

[[rule]]
pattern = '\bEOMs?\b|\bEoMs?\b'
use = 'equations of motion'
where = ['chapters', 'skills', 'figures', 'notebooks', 'case_studies']
math = false

[[rule]]
pattern = 'set-?point|hold point|\bgoals?\b|commanded attitude|nominal (trajectory|attitude)'
use = 'target (fixed) or reference (moving); the subscript d stands for desired'
ignore_case = true
math = false

[[rule]]
pattern = '\bgyros?\b'
use = 'gyroscope'
ignore_case = true
math = false

[[rule]]
pattern = 'multi-?rotor|multi-copter|quadcopter|quad-rotor|quadrocopter|\bUAVs?\b'
use = 'quadrotor (four rotors) or multicopter (any number)'
ignore_case = true
math = false
allow = ['quadrotor UAV']

[[rule]]
pattern = 'slung load|hanging load|tethered load|suspended payload|(?<!cable-)suspended loads?'
use = 'cable-suspended load'
ignore_case = true
math = false

[[rule]]
pattern = 'logarithmic (error|law|one)|\blog[- ]error|"log:|rotation-vector error'
use = 'logarithm error'
ignore_case = true
where = ['chapters', 'skills', 'figures', 'notebooks', 'case_studies']
